[project]
name = "fade"
version = "0.1.0"
description = "FADE fog density estimation — vectorized parallel implementation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fade"]

[tool.hatch.build.targets.wheel.sources]
"src/fade/data" = "fade/data"
